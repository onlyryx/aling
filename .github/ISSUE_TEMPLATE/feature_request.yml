name: Feature request
description: Suggest a focused capability or improvement
title: "feature: "
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and safety considerations
      description: Mention permissions, privacy, and whether the feature should default off.
    validations:
      required: true
