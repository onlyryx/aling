name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
      - run: uv python install 3.12
      - run: uv sync --frozen --extra dev
      - run: uv lock --check
      - run: uv run --frozen --extra dev ruff check .
      - run: uv run --frozen --extra dev ruff format --check .
      - run: uv run --frozen --extra dev pytest
      - run: uv build
      - run: RYXBOT_ENV_FILE=.env.example docker compose --env-file .env.example --profile qq config --quiet
      - run: RYXBOT_ENV_FILE=.env.example docker compose -f compose.yaml -f compose.webui.yaml --env-file .env.example --profile qq config --quiet
      - run: docker build -t aling:ci .
