name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
      - run: uv python install 3.12
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen --extra dev ruff check .
      - run: uv run --frozen --extra dev ruff format --check .
      - run: uv run --frozen --extra dev pytest
      - run: uv build
      - run: RYXBOT_ENV_FILE=.env.example docker compose --env-file .env.example --profile qq config --quiet
      - run: docker build -t aling:ci .
