[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "aling"
version = "0.3.1"
description = "阿零 (ALING), a plugin-based QQ group bot by Jack233_ (onlyryx)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Jack233_"}]
maintainers = [{name = "Jack233_"}]
keywords = ["qq", "bot", "nonebot2", "onebot-v11", "aling"]
dependencies = [
  "nonebot2[fastapi]>=2.5,<3",
  "nonebot-adapter-onebot>=2.4,<3",
  "httpx>=0.28,<0.29",
  "beautifulsoup4>=4.13,<5",
  "pydantic-settings>=2.8,<3",
  "pillow>=11,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "pytest-timeout>=2.4,<3", "ruff>=0.11,<1", "build>=1.2,<2"]

[project.urls]
Homepage = "https://github.com/onlyryx/aling"
Repository = "https://github.com/onlyryx/aling"
Issues = "https://github.com/onlyryx/aling/issues"

[project.scripts]
aling = "aling.app:main"
ryxbot = "aling.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aling"]
artifacts = ["src/aling/prompts/default.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 15
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
