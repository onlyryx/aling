[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ryxbot"
version = "0.1.0"
description = "A modular QQ group bot by onlyryx, powered by NoneBot2 and OneBot V11"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "onlyryx"}]
dependencies = [
  "nonebot2[fastapi]>=2.5,<3",
  "nonebot-adapter-onebot>=2.4,<3",
  "httpx>=0.28,<0.29",
  "beautifulsoup4>=4.13,<5",
  "pydantic-settings>=2.8,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "pytest-timeout>=2.4,<3", "ruff>=0.11,<1", "build>=1.2,<2"]

[project.scripts]
ryxbot = "ryxbot.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ryxbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 15

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
